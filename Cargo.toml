[workspace]
resolver = "2"
members = ["crates/tasks-core", "crates/tasks-render", "crates/tasks-kindle", "crates/tasks-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
tasks-core = { path = "crates/tasks-core" }
tasks-render = { path = "crates/tasks-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kl-core = { path = "../doannt-kindle-tools/crates/kl-core" }

[profile.release]
lto = true
codegen-units = 1
